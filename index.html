<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beach & Bandits | Splash Academy Bonaire</title>

  <!-- Hiermee kunnen we de Google Sheet netjes uitlezen -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px 60px;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .product {
      border: 1px solid #e8e8e8;
      border-radius: 14px;
      padding: 20px;
      background: white;
    }

    .product-image {
      height: 280px;
      background: #f3f3f3;
      border-radius: 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 20px;
      color: #999;
    }

    .product h2 {
      margin: 0 0 6px;
    }

    .color {
      color: #666;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;

      border: 1px solid #ccc;
      border-radius: 8px;

      background: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;

      padding: 14px;

      background: #222;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .error {
      text-align: center;
      padding: 40px;
      color: #b00020;
    }
  </style>
</head>

<body>

<header>
  <h1>Beach & Bandits</h1>
  <p>Available at Splash Academy Bonaire</p>
</header>

<div id="loading" class="loading">
  Loading swimwear...
</div>

<section id="products" class="products"></section>


<script>

  /* =========================================
     GOOGLE SHEET
     ========================================= */

  const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2DKu6fWuRkN-ObpGllK529agQRPeec31wsGBEukP_zva2ExkLMA7_KBZ2xPCHXifHgqHtxxuvIjXV/pub?gid=0&single=true&output=csv";


  /* =========================================
     PRODUCTEN UIT GOOGLE SHEET LADEN
     ========================================= */

  Papa.parse(SHEET_URL, {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {

      const products = results.data;

      document.getElementById("loading").style.display = "none";

      if (products.length === 0) {
        showError("No products found.");
        return;
      }

      renderProducts(products);
    },

    error: function(error) {

      document.getElementById("loading").style.display = "none";

      showError("The products could not be loaded.");

      console.error(error);
    }

  });


  /* =========================================
     PRODUCTEN OP WEBSITE TONEN
     ========================================= */

  function renderProducts(products) {

    const productContainer = document.getElementById("products");

    productContainer.innerHTML = "";


    products.forEach(product => {

      /*
        We zoeken automatisch alle kolommen
        waarvan de naam alleen uit cijfers bestaat.

        Bijvoorbeeld:
        116
        128
        140
        152
        164

        Daardoor kunnen we later maten toevoegen
        zonder de website opnieuw te programmeren.
      */

      const sizes = Object.keys(product).filter(column => {
        return /^\d+$/.test(column.trim());
      });


      const model =
        product["Model"] ||
        product["model"] ||
        "Swimsuit";

      const color =
        product["Kleur"] ||
        product["Color"] ||
        "";

      const price =
        product["Prijs"] ||
        product["Price"] ||
        "";


      /* Productkaart maken */

      const card = document.createElement("div");

      card.className = "product";


      /* Maten maken */

      let sizeOptions =
        `<option value="">Choose a size</option>`;


      sizes.forEach(size => {

        const stock =
          Number(product[size]) || 0;


        if (stock > 0) {

          sizeOptions += `
            <option value="${size}">
              ${size}
            </option>
          `;

        } else {

          sizeOptions += `
            <option value="${size}" disabled>
              ${size} - Sold out
            </option>
          `;

        }

      });


      card.innerHTML = `

        <div class="product-image">
          Product photo
        </div>

        <h2>${model}</h2>

        <div class="color">
          ${color}
        </div>

        <div class="price">
          $${price}
        </div>

        <label>
          Choose your size
        </label>

        <select>
          ${sizeOptions}
        </select>

        <button>
          Add to cart
        </button>

      `;


      productContainer.appendChild(card);

    });

  }


  /* =========================================
     FOUTMELDING
     ========================================= */

  function showError(message) {

    document.getElementById("products").innerHTML =
      `<div class="error">${message}</div>`;

  }

</script>

</body>
</html>
