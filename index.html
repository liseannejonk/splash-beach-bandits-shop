<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beach & Bandits | Splash Academy Bonaire</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .cart-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      width: auto;
      padding: 12px 18px;
      background: #222;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .product {
      border: 1px solid #e8e8e8;
      border-radius: 14px;
      padding: 20px;
      background: white;
    }

    .product-image {
      height: 280px;
      background: #f3f3f3;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      color: #999;
    }

    .product h2 {
      margin: 0 0 6px;
    }

    .color {
      color: #666;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }

    .add-button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .add-button:hover {
      opacity: 0.85;
    }

    .loading,
    .error {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: -430px;
      width: 400px;
      max-width: 100%;
      height: 100vh;
      background: white;
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);
      z-index: 2000;
      padding: 25px;
      transition: right 0.3s ease;
      overflow-y: auto;
    }

    .cart-panel.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .cart-header h2 {
      margin: 0;
    }

    .close-cart {
      border: none;
      background: none;
      font-size: 30px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 18px 0;
    }

    .cart-item strong {
      display: block;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .cart-item-details {
      color: #555;
      line-height: 1.5;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
    }

    .quantity-control button {
      width: 36px;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 50%;
      background: white;
      color: #222;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity-control span {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
    }

    .subtotal {
      font-weight: bold;
      margin-top: 8px;
    }

    .remove-button {
      margin-top: 10px;
      border: none;
      background: none;
      color: #b00020;
      cursor: pointer;
      padding: 0;
    }

    .cart-total {
      font-size: 21px;
      font-weight: bold;
      margin-top: 25px;
    }

    .empty-cart {
      color: #777;
    }

    .whatsapp-button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .whatsapp-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .cart-button {
        top: 10px;
        right: 10px;
      }

      header {
        padding-top: 70px;
      }

      .cart-panel {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<button class="cart-button" onclick="openCart()">
  🛒 Cart (<span id="cart-count">0</span>)
</button>

<header>
  <h1>Beach & Bandits</h1>
  <p>Available at Splash Academy Bonaire</p>
</header>

<div id="loading" class="loading">
  Loading swimwear...
</div>

<section id="products" class="products"></section>

<div id="cart-panel" class="cart-panel">

  <div class="cart-header">
    <h2>Your cart</h2>

    <button class="close-cart" onclick="closeCart()">
      ×
    </button>
  </div>

  <div id="cart-items"></div>

  <div id="cart-total" class="cart-total"></div>

  <button
    id="whatsapp-button"
    class="whatsapp-button"
    onclick="orderViaWhatsApp()"
    disabled
  >
    Order via WhatsApp
  </button>

</div>

<script>

  const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2DKu6fWuRkN-ObpGllK529agQRPeec31wsGBEukP_zva2ExkLMA7_KBZ2xPCHXifHgqHtxxuvIjXV/pub?gid=0&single=true&output=csv";

  const WHATSAPP_NUMBER = "5997777775";

  let cart = [];

  Papa.parse(SHEET_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {
      document.getElementById("loading").style.display = "none";

      if (results.data.length === 0) {
        showError("No products found.");
        return;
      }

      renderProducts(results.data);
    },

    error: function(error) {
      document.getElementById("loading").style.display = "none";
      showError("The products could not be loaded.");
      console.error(error);
    }
  });

  function renderProducts(products) {

    const container = document.getElementById("products");
    container.innerHTML = "";

    products.forEach((product, index) => {

      const sizes = Object.keys(product).filter(column => {
        return /^\d+$/.test(column.trim());
      });

      const model =
        product["Model"] ||
        product["model"] ||
        "Swimsuit";

      const color =
        product["Kleur"] ||
        product["Color"] ||
        "";

      const rawPrice =
        product["Prijs"] ||
        product["Price"] ||
        product["Prijs (USD)"] ||
        "0";

      const price =
        parseFloat(
          String(rawPrice)
            .replace("$", "")
            .replace(",", ".")
            .trim()
        ) || 0;

      let sizeOptions =
        `<option value="">Choose a size</option>`;

      sizes.forEach(size => {

        const stock = Number(product[size]) || 0;

        if (stock > 0) {
          sizeOptions += `
            <option
              value="${size}"
              data-stock="${stock}"
            >
              ${size}
            </option>
          `;
        } else {
          sizeOptions += `
            <option
              value="${size}"
              disabled
            >
              ${size} - Sold out
            </option>
          `;
        }
      });

      const card = document.createElement("div");
      card.className = "product";

      card.innerHTML = `
        <div class="product-image">
          Product photo
        </div>

        <h2>${model}</h2>

        <div class="color">
          ${color}
        </div>

        <div class="price">
          $${price.toFixed(2)}
        </div>

        <label>
          Choose your size
        </label>

        <select id="size-${index}">
          ${sizeOptions}
        </select>

        <button
          class="add-button"
          onclick="addToCart(
            '${escapeText(model)}',
            '${escapeText(color)}',
            ${price},
            'size-${index}'
          )"
        >
          Add to cart
        </button>
      `;

      container.appendChild(card);
    });
  }

  function addToCart(model, color, price, sizeSelectId) {

    const sizeSelect = document.getElementById(sizeSelectId);
    const size = sizeSelect.value;

    if (!size) {
      alert("Please choose a size first.");
      return;
    }

    const selectedOption =
      sizeSelect.options[sizeSelect.selectedIndex];

    const stock =
      Number(selectedOption.dataset.stock) || 0;

    const existingItem =
      cart.find(item =>
        item.model === model &&
        item.color === color &&
        item.size === size
      );

    if (existingItem) {

      if (existingItem.quantity < existingItem.stock) {
        existingItem.quantity++;
      } else {
        alert(
          `Sorry, only ${existingItem.stock} of this size are in stock.`
        );
      }

    } else {

      cart.push({
        model: model,
        color: color,
        price: price,
        size: size,
        quantity: 1,
        stock: stock
      });

    }

    updateCart();
    openCart();
  }

  function updateCart() {

    const cartItems =
      document.getElementById("cart-items");

    const cartCount =
      document.getElementById("cart-count");

    const cartTotal =
      document.getElementById("cart-total");

    const whatsappButton =
      document.getElementById("whatsapp-button");

    const totalItems =
      cart.reduce(
        (sum, item) => sum + item.quantity,
        0
      );

    cartCount.textContent = totalItems;

    if (cart.length === 0) {

      cartItems.innerHTML =
        `<div class="empty-cart">
          Your cart is empty.
        </div>`;

      cartTotal.textContent = "";

      whatsappButton.disabled = true;

      return;
    }

    whatsappButton.disabled = false;

    cartItems.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {

      const subtotal =
        item.price * item.quantity;

      total += subtotal;

      const itemDiv =
        document.createElement("div");

      itemDiv.className = "cart-item";

      itemDiv.innerHTML = `
        <strong>
          ${item.model}
        </strong>

        <div class="cart-item-details">
          ${item.color}
          <br>
          Size: ${item.size}
          <br>
          $${item.price.toFixed(2)} each
        </div>

        <div class="quantity-control">

          <button onclick="changeQuantity(${index}, -1)">
            −
          </button>

          <span>
            ${item.quantity}
          </span>

          <button onclick="changeQuantity(${index}, 1)">
            +
          </button>

        </div>

        <div class="subtotal">
          Subtotal:
          $${subtotal.toFixed(2)}
        </div>

        <button
          class="remove-button"
          onclick="removeFromCart(${index})"
        >
          Remove
        </button>
      `;

      cartItems.appendChild(itemDiv);
    });

    cartTotal.textContent =
      `Total: $${total.toFixed(2)}`;
  }

  function changeQuantity(index, change) {

    const item = cart[index];
    const newQuantity =
      item.quantity + change;

    if (newQuantity < 1) {
      removeFromCart(index);
      return;
    }

    if (newQuantity > item.stock) {
      alert(
        `Sorry, only ${item.stock} of this size are in stock.`
      );
      return;
    }

    item.quantity = newQuantity;

    updateCart();
  }

  function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();
  }

  function openCart() {

    document
      .getElementById("cart-panel")
      .classList.add("open");
  }

  function closeCart() {

    document
      .getElementById("cart-panel")
      .classList.remove("open");
  }

  function orderViaWhatsApp() {

    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    let total = 0;

    let message =
`Hi Splash Academy! 👋

I would like to place an order:

`;

    cart.forEach(item => {

      const subtotal =
        item.price * item.quantity;

      total += subtotal;

      message +=
`${item.quantity}x ${item.model}
Color: ${item.color}
Size: ${item.size}
Price: $${item.price.toFixed(2)} each
Subtotal: $${subtotal.toFixed(2)}

`;
    });

    message +=
`Total: $${total.toFixed(2)}

Name:
Pickup / preferred time:
Remarks:`;

    const encodedMessage =
      encodeURIComponent(message);

    const whatsappUrl =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

    window.open(
      whatsappUrl,
      "_blank"
    );
  }

  function showError(message) {

    document
      .getElementById("products")
      .innerHTML =
      `<div class="error">
        ${message}
      </div>`;
  }

  function escapeText(text) {

    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  updateCart();

</script>

</body>
</html>
