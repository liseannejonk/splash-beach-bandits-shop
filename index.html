<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beach & Bandits | Splash Academy Bonaire</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .cart-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;

      width: auto;
      padding: 12px 18px;

      background: #222;
      color: white;
      border: none;
      border-radius: 30px;

      cursor: pointer;
      font-size: 15px;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 80px;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .product {
      border: 1px solid #e8e8e8;
      border-radius: 14px;
      padding: 20px;
      background: white;
    }

    .product-image {
      height: 280px;
      background: #f3f3f3;
      border-radius: 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 20px;
      color: #999;
    }

    .product h2 {
      margin: 0 0 6px;
    }

    .color {
      color: #666;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;

      border: 1px solid #ccc;
      border-radius: 8px;

      background: white;
      font-size: 15px;
    }

    .add-button {
      width: 100%;
      border: none;
      border-radius: 8px;

      padding: 14px;

      background: #222;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    .add-button:hover {
      opacity: 0.85;
    }

    .loading,
    .error {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: -420px;

      width: 390px;
      max-width: 100%;
      height: 100vh;

      background: white;
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);

      z-index: 2000;
      padding: 25px;

      transition: right 0.3s ease;
      overflow-y: auto;
    }

    .cart-panel.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .cart-header h2 {
      margin: 0;
    }

    .close-cart {
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .cart-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .remove-button {
      margin-top: 8px;
      border: none;
      background: none;
      color: #b00020;
      cursor: pointer;
      padding: 0;
    }

    .cart-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 25px;
    }

    .empty-cart {
      color: #777;
    }

    .checkout-placeholder {
      width: 100%;
      margin-top: 20px;
      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #ddd;
      color: #666;

      font-size: 16px;
    }

    @media (max-width: 600px) {
      .cart-button {
        top: 10px;
        right: 10px;
      }

      header {
        padding-top: 70px;
      }
    }
  </style>
</head>

<body>

<button class="cart-button" onclick="openCart()">
  🛒 Cart (<span id="cart-count">0</span>)
</button>

<header>
  <h1>Beach & Bandits</h1>
  <p>Available at Splash Academy Bonaire</p>
</header>

<div id="loading" class="loading">
  Loading swimwear...
</div>

<section id="products" class="products"></section>

<div id="cart-panel" class="cart-panel">

  <div class="cart-header">
    <h2>Your cart</h2>

    <button class="close-cart" onclick="closeCart()">
      ×
    </button>
  </div>

  <div id="cart-items"></div>

  <div id="cart-total" class="cart-total"></div>

  <button class="checkout-placeholder">
    Order via WhatsApp — coming next
  </button>

</div>

<script>

  const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2DKu6fWuRkN-ObpGllK529agQRPeec31wsGBEukP_zva2ExkLMA7_KBZ2xPCHXifHgqHtxxuvIjXV/pub?gid=0&single=true&output=csv";

  let cart = [];

  Papa.parse(SHEET_URL, {

    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(results) {

      const products = results.data;

      document.getElementById("loading").style.display = "none";

      if (products.length === 0) {
        showError("No products found.");
        return;
      }

      renderProducts(products);
    },

    error: function(error) {

      document.getElementById("loading").style.display = "none";

      showError("The products could not be loaded.");

      console.error(error);
    }

  });

  function renderProducts(products) {

    const productContainer =
      document.getElementById("products");

    productContainer.innerHTML = "";

    products.forEach((product, index) => {

      const sizes = Object.keys(product).filter(column => {
        return /^\d+$/.test(column.trim());
      });

      const model =
        product["Model"] ||
        product["model"] ||
        "Swimsuit";

      const color =
        product["Kleur"] ||
        product["Color"] ||
        "";

     const rawPrice =
  product["Prijs"] ||
  product["Price"] ||
  product["Prijs (USD)"] ||
  "0";

const price =
  parseFloat(
    String(rawPrice)
      .replace("$", "")
      .replace(",", ".")
      .trim()
  ) || 0;

      const card =
        document.createElement("div");

      card.className = "product";

      let sizeOptions =
        `<option value="">Choose a size</option>`;

      sizes.forEach(size => {

        const stock =
          Number(product[size]) || 0;

        if (stock > 0) {

          sizeOptions += `
            <option value="${size}">
              ${size}
            </option>
          `;

        } else {

          sizeOptions += `
            <option value="${size}" disabled>
              ${size} - Sold out
            </option>
          `;

        }

      });

      card.innerHTML = `

        <div class="product-image">
          Product photo
        </div>

        <h2>${model}</h2>

        <div class="color">
          ${color}
        </div>

        <div class="price">
          $${price}
        </div>

        <label>
          Choose your size
        </label>

        <select id="size-${index}">
          ${sizeOptions}
        </select>

        <button
          class="add-button"
          onclick="addToCart(
            '${escapeText(model)}',
            '${escapeText(color)}',
            ${price},
            'size-${index}'
          )"
        >
          Add to cart
        </button>

      `;

      productContainer.appendChild(card);
    });

  }

  function addToCart(model, color, price, sizeSelectId) {

    const sizeSelect =
      document.getElementById(sizeSelectId);

    const size =
      sizeSelect.value;

    if (!size) {

      alert("Please choose a size first.");

      return;
    }

    const item = {
      model: model,
      color: color,
      price: price,
      size: size
    };

    cart.push(item);

    updateCart();

    openCart();
  }

  function updateCart() {

    const cartItems =
      document.getElementById("cart-items");

    const cartCount =
      document.getElementById("cart-count");

    const cartTotal =
      document.getElementById("cart-total");

    cartCount.textContent =
      cart.length;

    if (cart.length === 0) {

      cartItems.innerHTML =
        `<div class="empty-cart">Your cart is empty.</div>`;

      cartTotal.textContent = "";

      return;
    }

    cartItems.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {

      total += item.price;

      const itemDiv =
        document.createElement("div");

      itemDiv.className =
        "cart-item";

      itemDiv.innerHTML = `

        <strong>
          ${item.model}
        </strong>

        <div>
          ${item.color}
        </div>

        <div>
          Size: ${item.size}
        </div>

        <div>
          $${item.price}
        </div>

        <button
          class="remove-button"
          onclick="removeFromCart(${index})"
        >
          Remove
        </button>

      `;

      cartItems.appendChild(itemDiv);
    });

    cartTotal.textContent =
      `Total: $${total}`;

  }

  function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();
  }

  function openCart() {

    document
      .getElementById("cart-panel")
      .classList.add("open");
  }

  function closeCart() {

    document
      .getElementById("cart-panel")
      .classList.remove("open");
  }

  function showError(message) {

    document.getElementById("products").innerHTML =
      `<div class="error">${message}</div>`;
  }

  function escapeText(text) {

    return String(text)
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  updateCart();

</script>

</body>
</html>
